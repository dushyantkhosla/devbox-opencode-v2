# OpenCode v2 devbox for a remote Linux server. See README.md.
#
# Required exports (server shell): GITHUB_PAT, GIT_USER_NAME, GIT_USER_EMAIL.
# Optional: HOST_WORKSPACE (default: dir holding the compose file),
# OPENCODE_PORT (default 4096), OPENCODE_SERVER_PASSWORD, provider keys,
# HOST_UID/HOST_GID.
#
# The container idles after seeding; start the server from tmux:
#   docker compose exec opencode-devbox tmux new-session -A -s dev
#   opencode serve --hostname 0.0.0.0 --port "$OPENCODE_PORT"
services:
  opencode-devbox:
    build:
      context: .devbox
      dockerfile: Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    # Explicit tag instead of compose's auto `<project>-<service>` name.
    # Multi-instance is fine: same Dockerfile, same content, tag reused.
    image: opencode-devbox:latest
    init: true
    restart: unless-stopped
    # Chromium crashes on Docker's default 64M /dev/shm (tab crashes under
    # heavy pages/screenshots). Playwright also passes --disable-dev-shm-usage,
    # but 1gb here removes the whole class of failure.
    shm_size: "1gb"
    stdin_open: true
    tty: true
    working_dir: /workspace
    # Shared project network (see compose.yml): postgres is reachable as
    # `postgres` (or `db`), mailpit as `mailpit`, from inside this container.
    networks:
      - devbox-net
    environment:
      GITHUB_PAT: ${GITHUB_PAT:?GITHUB_PAT must be exported}
      GIT_USER_NAME: ${GIT_USER_NAME:?GIT_USER_NAME must be exported}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:?GIT_USER_EMAIL must be exported}
      GIT_ASKPASS: /usr/local/bin/git-askpass
      GIT_TERMINAL_PROMPT: "0"
      OPENCODE_PORT: ${OPENCODE_PORT:-4096}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # Fixed (not passed through from the host): the image has no TERM, and
      # client TERM is not forwarded through `docker compose exec`. Host
      # terminals like ghostty/kitty have no terminfo entry here, and tmux
      # aborts with "missing or unsuitable terminal". xterm-256color is in
      # the base image's terminfo database and is always sufficient.
      TERM: xterm-256color
    ports:
      - "${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    volumes:
      # Project source: the directory containing this compose file (drop-in
      # per-project usage). Override with HOST_WORKSPACE when these files live
      # in a central checkout instead.
      - "${HOST_WORKSPACE:-.}:/workspace"
      - opencode-data:/home/dev/.local
      - opencode-config:/home/dev/.config/opencode
      - agent-skills:/home/dev/.agents/skills
      # Seed source, read-only, from this checkout (versions with the repo
      # instead of a per-host ~/.config/opencode-v2 / ~/.agents/skills).
      # The entrypoint copies it into writable volumes on first start;
      # afterwards the in-container copies are independent: container edits
      # never touch the host, host edits don't flow in (delete the marker
      # to re-seed). Relative source resolves against this compose file's
      # directory, so this works from any shell/cwd.
      -
        type: bind
        source: ./.devbox/.config/opencode
        target: /seed
        read_only: true
        bind:
          create_host_path: false

volumes:
  opencode-data:
  opencode-config:
  agent-skills:

networks:
  # Shared with compose.yml (postgres + mailpit). Explicit name so both
  # files attach to the same network regardless of compose project name;
  # declared (not external) in both, so startup order doesn't matter.
  devbox-net:
    name: devbox-net
